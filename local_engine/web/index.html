<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZUASH PDF AI</title><style>
body{margin:0;background:#090a0c;color:#eee;font:15px system-ui,Arial}.wrap{max-width:1050px;margin:auto;padding:40px 20px}.brand{color:#d7b56d;letter-spacing:.18em;font-weight:700}.hero{margin:40px 0}.hero h1{font-size:clamp(36px,7vw,64px);line-height:1;margin:0 0 15px}.hero p{color:#999;max-width:760px;line-height:1.6}.panel{background:#111317;border:1px solid #292d33;border-radius:20px;padding:24px}.drop{display:block;border:1px dashed #555;border-radius:16px;padding:40px;text-align:center;cursor:pointer}.drop:hover{border-color:#d7b56d}.hidden{display:none}button{margin-top:15px;background:#d7b56d;border:0;border-radius:10px;padding:13px 18px;font-weight:700;cursor:pointer}.bar{height:10px;background:#222;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#d7b56d;transition:width .25s}.stage{font-size:20px;font-weight:700;margin-top:18px}.muted{color:#999}.warn{color:#e6b65c}.ok{color:#6edb9b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}.card{background:#0c0e11;border:1px solid #292d33;border-radius:14px;padding:16px}.name{font-size:18px;font-weight:700}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{background:#1a1d22;padding:9px 12px;border-radius:9px}a{color:#d7b56d}</style></head><body><main class="wrap"><div class="brand">ZUASH · TEXT AI</div><section class="hero"><h1>PDF → perfumes.</h1><p>Extrae el texto del catalogo, usa Qwen3 para identificar perfumes y busca la ficha e imagen en Fragrantica. El PDF no se analiza visualmente.</p></section><section class="panel"><label class="drop"><input id="file" class="hidden" type="file" accept="application/pdf"><div>Selecciona o arrastra tu PDF</div><div id="fn" class="muted"></div></label><button id="go">Analizar PDF</button><span id="health" class="muted"> comprobando IA...</span><div id="progress" class="hidden"><div style="display:flex;justify-content:space-between;margin-top:25px"><b id="pct">0%</b><span id="elapsed" class="muted">0 s</span></div><div class="bar"><div id="fill" class="fill"></div></div><div id="stage" class="stage">Preparando</div><div id="detail" class="muted"></div><div id="slow" class="warn"></div></div><div id="result"></div></section></main><script>
const fileEl=document.getElementById('file'),go=document.getElementById('go');fileEl.onchange=()=>document.getElementById('fn').textContent=fileEl.files[0]?.name||'';fetch('/api/health').then(r=>r.json()).then(d=>document.getElementById('health').textContent=d.ollama?' IA lista · '+d.qwen_model:' IA no disponible').catch(()=>document.getElementById('health').textContent=' IA no disponible');
go.onclick=async()=>{const f=fileEl.files[0];if(!f)return alert('Selecciona un PDF');go.disabled=true;document.getElementById('progress').classList.remove('hidden');const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/analyze-pdf',{method:'POST',body:fd}),d=await r.json();poll(d.job_id)}catch(e){document.getElementById('detail').textContent=e.message;go.disabled=false}};
async function poll(id){const d=await(await fetch('/api/analyze-pdf/'+id)).json();document.getElementById('pct').textContent=d.percent+'%';document.getElementById('fill').style.width=d.percent+'%';document.getElementById('stage').textContent=d.stage;document.getElementById('detail').textContent=d.detail;document.getElementById('elapsed').textContent=d.elapsed_seconds+' s';if(d.elapsed_seconds>45&&d.status==='running')document.getElementById('slow').textContent='La inferencia esta tardando mas de lo normal; Qwen sigue trabajando.';if(d.status==='done'){render(d.result);go.disabled=false;return}if(d.status==='error'){document.getElementById('detail').textContent=d.detail;go.disabled=false;return}setTimeout(()=>poll(id),700)}
function render(d){document.getElementById('result').innerHTML='<div class="stats"><div class="stat">Paginas: <b>'+d.stats.pages+'</b></div><div class="stat">Detectados: <b>'+d.stats.detected+'</b></div><div class="stat">Unicos: <b>'+d.stats.unique+'</b></div><div class="stat">Fragrantica: <b>'+d.stats.found+'</b></div></div><div class="grid">'+d.products.map(p=>'<article class="card"><div class="name">'+esc(p.name)+'</div><div class="muted">'+esc([p.variant,p.brand].filter(Boolean).join(' · '))+'</div><div class="muted">Pagina(s): '+p.pages.join(', ')+'</div><div style="margin-top:10px">'+(p.found?'<span class="ok">✓ Encontrado</span> · <a target="_blank" rel="noopener" href="'+esc(p.fragrantica_url)+'">Fragrantica</a>':'<span class="warn">⚠ No encontrado</span>')+'</div></article>').join('')+'</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
