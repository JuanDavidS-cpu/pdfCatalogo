<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUASH Catalog Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:24px 6%;border-bottom:1px solid #302712;display:flex;justify-content:space-between;align-items:center}
.logo{letter-spacing:9px;font-size:30px;font-weight:800;color:#d9b84a}header small{color:#888}
main{max-width:1200px;margin:35px auto;padding:0 20px}h1{text-align:center;font-size:40px;margin:0}
.sub{text-align:center;color:#999;margin:8px 0 28px}
.drop{display:block;text-align:center;padding:48px;border:1px dashed #766020;border-radius:18px;background:#101010;cursor:pointer}
.drop:hover{border-color:#e2c65b}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}
.tools .grow{flex:1}button{border:1px solid #c9a227;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:linear-gradient(#e0c35a,#a17e18);color:#090909}
button.alt{background:#161616;color:#eee;border-color:#444}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#101010;border:1px solid #292929;border-radius:14px;overflow:hidden;position:relative}
.pic{height:255px;display:flex;align-items:center;justify-content:center;padding:12px;background:#050505}.pic img{max-width:100%;max-height:100%;object-fit:contain}
.body{padding:12px}.body input{width:100%;padding:10px;background:#181818;border:1px solid #3a3a3a;border-radius:7px;color:#fff;font-weight:700}
.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;font-size:11px}.tag{position:absolute;top:8px;left:8px;background:#000d;border:1px solid #6d591d;color:#e3c75d;border-radius:20px;padding:4px 7px;font-size:10px;z-index:2}
.status{color:#999;font-size:13px;margin:12px 0}.hide{display:none}
.ml{color:#bca866;font-size:12px;margin-top:5px}.review{border-color:#8b5b20}
</style>
</head>
<body>
<header><div class="logo">ZUASH</div><small>PREMIUM FRAGRANCE CATALOG STUDIO · IA VISUAL</small></header>
<main>
<h1>Generador de catálogo</h1>
<div class="sub">PDF de proveedor → detección individual con visión artificial → identificación → imagen limpia</div>
<label class="drop"><b>Arrastra el PDF aquí o haz clic para seleccionarlo</b><br><small>La detección visual se ejecuta en el navegador.</small><input id="file" type="file" accept="application/pdf" hidden></label>
<div id="tools" class="tools hide">
<button id="add">＋ Añadir</button><button id="search" class="alt">🔎 Completar imágenes</button>
<span class="grow"></span><button id="pdf">Generar catálogo PDF</button>
</div>
<div id="status" class="status"></div><div id="grid" class="grid"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const {jsPDF}=window.jspdf;
const $=id=>document.getElementById(id),state=[];
const FRAGANTICA_API="/api/fragrantica";
let visionModel=null;

const fileInput=$("file"),drop=document.querySelector(".drop");
fileInput.addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)readPdf(f)});
drop.addEventListener("dragover",e=>{e.preventDefault();drop.style.borderColor="#e2c65b"});
drop.addEventListener("dragleave",()=>drop.style.borderColor="");
drop.addEventListener("drop",e=>{e.preventDefault();drop.style.borderColor="";const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)readPdf(f)});

function cleanText(s){return String(s||"").replace(/\s+/g," ").trim()}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}
function unique(arr){return [...new Set(arr.filter(Boolean))]}

function nameFromText(items){
 const bad=/^(ml|oz|eau de parfum|eau de toilette|parfum|perfume|hombre|mujer|men|women|masculino|femenino|original|unisex|spray|edp|edt)$/i;
 const a=items.map(x=>cleanText(x.str)).filter(x=>x.length>2&&!bad.test(x)&&!/^[\d\W]+$/.test(x));
 return a.sort((x,y)=>y.length-x.length)[0]||"Perfume";
}

function textBlocks(items,scale,pageHeight){
 return items.map(x=>{
  const t=x.transform||[1,0,0,1,0,0],fs=Math.max(8,Math.abs(t[3]||t[0]||10));
  const x0=(t[4]||0)*scale, y0=pageHeight-(t[5]||0)*scale-fs*scale;
  return {text:cleanText(x.str),x:x0,y:y0,w:Math.max(4,(x.width||fs)*scale),h:fs*scale};
 }).filter(x=>x.text.length>1);
}

function textForBox(blocks,b){
 const cx=b.x+b.w/2,cy=b.y+b.h/2;
 const candidates=blocks.map(t=>{
  const tx=t.x+t.w/2,ty=t.y+t.h/2;
  const dx=Math.max(0,Math.abs(cx-tx)-b.w/2),dy=Math.max(0,Math.abs(cy-ty)-b.h/2);
  const distance=Math.hypot(dx,dy);
  const overlap=(tx>=b.x-b.w*.45&&tx<=b.x+b.w*1.45&&ty>=b.y-b.h*.6&&ty<=b.y+b.h*1.6)?1:0;
  return {...t,distance,score:overlap*100000-distance};
 }).filter(x=>x.distance<Math.max(260,b.w*1.8,b.h*1.4)).sort((a,b)=>b.score-a.score);
 const picked=[];
 for(const c of candidates){if(!picked.includes(c.text))picked.push(c.text);if(picked.length>=4)break}
 return picked.join(" ");
}

async function getVisionModel(){
 if(visionModel)return visionModel;
 $("status").textContent="Cargando modelo de visión artificial… (solo la primera vez)";
 visionModel=await cocoSsd.load({base:"lite_mobilenet_v2"});
 return visionModel;
}

function cropCanvas(source,b,pad=0.08){
 const x=Math.max(0,Math.floor(b.x-b.w*pad)),y=Math.max(0,Math.floor(b.y-b.h*pad));
 const r=Math.min(source.width,Math.ceil(b.x+b.w+b.w*pad)),bt=Math.min(source.height,Math.ceil(b.y+b.h+b.h*pad));
 const out=document.createElement("canvas");out.width=Math.max(1,r-x);out.height=Math.max(1,bt-y);
 out.getContext("2d").drawImage(source,x,y,out.width,out.height,0,0,out.width,out.height);
 return out;
}

async function trimProductImage(src){
 return new Promise(resolve=>{
  const im=new Image();im.onload=()=>{
   const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement("canvas");c.width=w;c.height=h;
   const x=c.getContext("2d");x.drawImage(im,0,0);const d=x.getImageData(0,0,w,h).data;
   const samples=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([px,py])=>{const j=(py*w+px)*4;return[d[j],d[j+1],d[j+2]]});
   const bg=samples.reduce((a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],[0,0,0]).map(v=>v/4);
   let minX=w,minY=h,maxX=-1,maxY=-1;const threshold=32;
   for(let yy=0;yy<h;yy+=2)for(let xx=0;xx<w;xx+=2){
    const j=(yy*w+xx)*4,dist=Math.abs(d[j]-bg[0])+Math.abs(d[j+1]-bg[1])+Math.abs(d[j+2]-bg[2]);
    if(d[j+3]>15&&dist>threshold){minX=Math.min(minX,xx);minY=Math.min(minY,yy);maxX=Math.max(maxX,xx);maxY=Math.max(maxY,yy)}
   }
   if(maxX<0){resolve(src);return}
   const pad=Math.max(8,Math.round(Math.max(w,h)*.025));minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
   const out=document.createElement("canvas");out.width=maxX-minX+1;out.height=maxY-minY+1;
   out.getContext("2d").drawImage(c,minX,minY,out.width,out.height,0,0,out.width,out.height);
   resolve(out.toDataURL("image/png"));
  };im.onerror=()=>resolve(src);im.src=src;
 });
}

async function identifyFragrantica(name){
 try{const r=await fetch(FRAGANTICA_API+"?name="+encodeURIComponent(name));if(!r.ok)return null;return await r.json()}
 catch(e){return null}
}

async function applyFragrantica(p){
 const q=cleanText(p.name);
 if(!q||q==="Perfume")return false;
 const m=await identifyFragrantica(q);
 if(m&&m.name){
  p.name=m.name;p.fragrantica=m.url||null;p.image=m.image||p.image;p.confidence=m.confidence||"texto";
  if(m.image)p.src=m.image;
  return true;
 }
 return false;
}

async function extractEmbeddedImages(page){
 const out=[];
 try{
  const op=await page.getOperatorList();
  for(let i=0;i<op.fnArray.length;i++){
   const fn=op.fnArray[i],args=op.argsArray[i];
   if(fn!==pdfjsLib.OPS.paintImageXObject&&fn!==pdfjsLib.OPS.paintJpegXObject)continue;
   const key=args[0];let obj=null;
   for(let tries=0;tries<30&&!obj;tries++){obj=page.objs.get(key);if(!obj)await new Promise(r=>setTimeout(r,20))}
   if(obj&&obj.width&&obj.height){
    const q=document.createElement("canvas");q.width=obj.width;q.height=obj.height;q.getContext("2d").drawImage(obj,0,0);
    out.push(q.toDataURL("image/png"));
   }
  }
 }catch(e){console.warn(e)}
 return out;
}

async function detectIndividualProducts(canvas,blocks){
 const model=await getVisionModel();
 const detections=await model.detect(canvas,50,0.18);
 // COCO-SSD has a generic "bottle" class, so it is used as a visual locator,
 // not as the final perfume identity. Text/Fragrantica performs identity.
 let boxes=detections.filter(d=>d.class==="bottle"&&d.score>=0.18).map(d=>({
  x:d.bbox[0],y:d.bbox[1],w:d.bbox[2],h:d.bbox[3],score:d.score,label:d.class
 }));
 // Some perfume layouts are boxes rather than bottles. Keep other tall/compact
 // detections only when they are plausibly product-sized.
 const other=detections.filter(d=>d.class!=="person"&&d.class!=="cell phone"&&d.score>=0.35).map(d=>({
  x:d.bbox[0],y:d.bbox[1],w:d.bbox[2],h:d.bbox[3],score:d.score,label:d.class
 }));
 boxes=boxes.concat(other.slice(0,10));
 boxes=dedupeBoxes(boxes);
 return boxes.sort((a,b)=>(a.y-b.y)||(a.x-b.x)).map(b=>({...b,text:textForBox(blocks,b)}));
}

function dedupeBoxes(boxes){
 const kept=[];
 for(const b of boxes.sort((a,b)=>b.score-a.score)){
  const overlap=kept.some(k=>iou(k,b)>.55);
  if(!overlap)kept.push(b);
 }
 return kept;
}
function iou(a,b){
 const x=Math.max(a.x,b.x),y=Math.max(a.y,b.y),r=Math.min(a.x+a.w,b.x+b.w),bt=Math.min(a.y+a.h,b.y+b.h);
 const inter=Math.max(0,r-x)*Math.max(0,bt-y),area=a.w*a.h+b.w*b.h-inter;
 return area?inter/area:0;
}

async function readPdf(file){
 if(!file)return;
 if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){$("status").textContent="Selecciona un PDF válido.";return}
 state.length=0;$("tools").classList.remove("hide");$("grid").innerHTML="";
 $("status").textContent="Abriendo PDF…";
 try{
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const model=await getVisionModel();
  for(let n=1;n<=pdf.numPages;n++){
   $("status").textContent="Analizando página "+n+" de "+pdf.numPages+"…";
   const page=await pdf.getPage(n),view=page.getViewport({scale:2.4});
   const c=document.createElement("canvas");c.width=Math.ceil(view.width);c.height=Math.ceil(view.height);
   await page.render({canvasContext:c.getContext("2d"),viewport:view}).promise;
   const text=await page.getTextContent(),blocks=textBlocks(text.items||[],2.4,c.height);
   const embedded=await extractEmbeddedImages(page);
   let products=[];
   // If the PDF contains separate image objects, use them first.
   if(embedded.length>1){
    products=embedded.map((src,i)=>({name:i===0?nameFromText(text.items||[]):"Perfume",src,kind:"imagen PDF",confidence:"estructura"}));
   }else{
    // If the page is a single raster/composite, use ML object detection.
    const boxes=await detectIndividualProducts(c,blocks);
    for(let i=0;i<boxes.length;i++){
     const b=boxes[i],crop=cropCanvas(c,b),src=await trimProductImage(crop.toDataURL("image/png"));
     products.push({name:b.text||"Perfume",src,kind:"IA visual",confidence:b.score,imageBox:b});
    }
   }
   // Never use the entire supplier page as a product.
   if(!products.length){
    $("status").textContent="Página "+n+": no se detectaron perfumes individualmente. Se omite para evitar meter la marca/Instagram del proveedor.";
    continue;
   }
   for(const p of products){
    await applyFragrantica(p);
    state.push(p);
    render();
   }
  }
  $("status").textContent=state.length+" perfumes detectados. La IA separa productos; Fragrantica intenta resolver el nombre y la imagen limpia.";
 }catch(err){console.error(err);$("status").textContent="No se pudo procesar el PDF: "+(err.message||"error desconocido")}
}

function render(){
 $("grid").innerHTML="";
 state.forEach((p,i)=>{
  const d=document.createElement("article");d.className="card"+(p.confidence==="revisar"?" review":"");
  d.innerHTML='<span class="tag">'+esc(p.kind)+(p.fragrantica?' · Fragrantica ✓':' · revisar')+'</span><div class="pic"><img src="'+p.src+'" alt=""></div><div class="body"><input value="'+esc(p.name)+'"><div class="ml">'+(typeof p.confidence==="number"?"Detección IA: "+Math.round(p.confidence*100)+"%":"Identificación por texto")+'</div><div class="actions"><button class="alt find">Imagen limpia</button><button class="alt frag">Fragrantica</button><button class="alt del">Eliminar</button></div></div>';
  d.querySelector("input").oninput=e=>p.name=e.target.value;
  d.querySelector(".find").onclick=async()=>{const ok=await applyFragrantica(p);if(!ok)window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name+" perfume bottle"),"_blank");render()};
  d.querySelector(".frag").onclick=async()=>{const ok=await applyFragrantica(p);if(!ok)window.open("https://www.google.com/search?q="+encodeURIComponent("site:fragrantica.com/perfume "+p.name),"_blank");render()};
  d.querySelector(".del").onclick=()=>{state.splice(i,1);render()};
  $("grid").appendChild(d);
 });
}

$("add").onclick=()=>{state.push({name:"Nuevo perfume",src:"data:image/svg+xml;charset=utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#050505"/><text x="50%" y="50%" fill="#d9b84a" text-anchor="middle" font-size="30">ZUASH</text></svg>'),kind:"manual",confidence:"revisar"});render()};
$("search").onclick=async()=>{for(const p of state){if(!p.fragrantica)await applyFragrantica(p)}render()};
$("pdf").onclick=()=>{
 if(!state.length){$("status").textContent="Primero carga un PDF.";return}
 const doc=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=10,G=5,C=2,R=4,top=22,cw=(W-2*M-G)/C,ch=(H-top-M-G*3)/R;
 state.forEach((p,i)=>{
  if(i&&i%8===0)doc.addPage();
  if(i%8===0){doc.setFillColor(7,7,7);doc.rect(0,0,W,H,"F");doc.setTextColor(225,194,82);doc.setFont("helvetica","bold");doc.setFontSize(19);doc.text("ZUASH",W/2,13,{align:"center"});doc.setDrawColor(120,95,25);doc.line(M,17,W-M,17)}
  const k=i%8,x=M+(k%2)*(cw+G),y=top+Math.floor(k/2)*(ch+G);
  doc.setFillColor(15,15,15);doc.roundedRect(x,y,cw,ch,3,3,"F");doc.setDrawColor(48,48,48);doc.roundedRect(x,y,cw,ch,3,3,"S");
  try{doc.addImage(p.src,p.src.startsWith("data:image/png")?"PNG":"JPEG",x+4,y+5,cw-8,ch-23,undefined,"FAST")}catch(e){}
  doc.setTextColor(225,194,82);doc.setFontSize(10);doc.text(p.name||"Perfume",x+cw/2,y+ch-8,{align:"center",maxWidth:cw-8});
 });
 doc.save("Catalogo-ZUASH.pdf");$("status").textContent="Catálogo generado correctamente.";
};
window.addEventListener("error",e=>{if(e.message)$("status").textContent="Error: "+e.message});
</script>
</body>
</html>
