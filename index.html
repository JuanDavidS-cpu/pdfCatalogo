<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUASH Catalog Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Arial,sans-serif}header{padding:24px 6%;border-bottom:1px solid #302712;display:flex;justify-content:space-between;align-items:center}.logo{letter-spacing:9px;font-size:30px;font-weight:800;color:#d9b84a}header small{color:#888}main{max-width:1150px;margin:35px auto;padding:0 20px}h1{text-align:center;font-size:40px;margin:0}.sub{text-align:center;color:#999;margin:8px 0 28px}.drop{display:block;text-align:center;padding:48px;border:1px dashed #766020;border-radius:18px;background:#101010;cursor:pointer}.drop:hover{border-color:#e2c65b}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.tools .grow{flex:1}button{border:1px solid #c9a227;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:linear-gradient(#e0c35a,#a17e18);color:#090909}button.alt{background:#161616;color:#eee;border-color:#444}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#101010;border:1px solid #292929;border-radius:14px;overflow:hidden;position:relative}.pic{height:255px;display:flex;align-items:center;justify-content:center;padding:12px;background:#050505}.pic img{max-width:100%;max-height:100%;object-fit:contain}.body{padding:12px}.body input{width:100%;padding:10px;background:#181818;border:1px solid #3a3a3a;border-radius:7px;color:#fff;font-weight:700}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;font-size:12px}.tag{position:absolute;top:8px;left:8px;background:#000d;border:1px solid #6d591d;color:#e3c75d;border-radius:20px;padding:4px 7px;font-size:10px}.status{color:#999;font-size:13px;margin:12px 0}.hide{display:none}
</style></head><body>
<header><div class="logo">ZUASH</div><small>PREMIUM FRAGRANCE CATALOG STUDIO</small></header>
<main><h1>Generador de catálogo</h1><div class="sub">PDF de proveedor → perfumes individuales → catálogo negro y dorado</div>
<label class="drop"><b>Arrastra el PDF aquí o haz clic para seleccionarlo</b><br><small>El procesamiento se realiza localmente en tu navegador.</small><input id="file" type="file" accept="application/pdf" hidden></label>
<div id="tools" class="tools hide"><button id="add">＋ Añadir</button><button id="search" class="alt">🔎 Buscar imágenes faltantes</button><span class="grow"></span><button id="pdf">Generar catálogo PDF</button></div>
<div id="status" class="status"></div><div id="grid" class="grid"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const { jsPDF } = window.jspdf;
const $=id=>document.getElementById(id),state=[];
const FRAGANTICA_API="/api/fragrantica";
const fileInput=$("file"), drop=document.querySelector(".drop");

fileInput.addEventListener("change",e=>{
 const file=e.target.files&&e.target.files[0];
 if(file) readPdf(file);
});
drop.addEventListener("dragover",e=>{e.preventDefault();drop.style.borderColor="#e2c65b"});
drop.addEventListener("dragleave",()=>drop.style.borderColor="");
drop.addEventListener("drop",e=>{
 e.preventDefault();drop.style.borderColor="";
 const file=e.dataTransfer.files&&e.dataTransfer.files[0];
 if(file) readPdf(file);
});

function nameFromText(items){
 const bad=/^(ml|oz|eau de parfum|eau de toilette|parfum|perfume|hombre|mujer|men|women|masculino|femenino|original|unisex)$/i;
 const a=items.map(x=>(x.str||"").replace(/\s+/g," ").trim()).filter(x=>x.length>2&&!bad.test(x)&&!/^[\d\W]+$/.test(x));
 return a.sort((x,y)=>y.length-x.length)[0]||"Perfume";
}

function trimProductImage(src){
 return new Promise(resolve=>{
  const im=new Image();
  im.onload=()=>{
   const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement("canvas");
   c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0);
   const d=x.getImageData(0,0,w,h).data;
   const samples=[];
   for(const [px,py] of [[0,0],[w-1,0],[0,h-1],[w-1,h-1]]){const j=(py*w+px)*4;samples.push([d[j],d[j+1],d[j+2]])}
   const bg=samples.reduce((a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],[0,0,0]).map(v=>v/4);
   let minX=w,minY=h,maxX=-1,maxY=-1;
   const threshold=32;
   for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
    const j=(yy*w+xx)*4,dist=Math.abs(d[j]-bg[0])+Math.abs(d[j+1]-bg[1])+Math.abs(d[j+2]-bg[2]);
    if(d[j+3]>15 && dist>threshold){minX=Math.min(minX,xx);minY=Math.min(minY,yy);maxX=Math.max(maxX,xx);maxY=Math.max(maxY,yy)}
   }
   if(maxX<0){resolve(src);return}
   const pad=Math.max(8,Math.round(Math.max(w,h)*.025));
   minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(w-1,maxX+pad);maxY=Math.min(h-1,maxY+pad);
   const out=document.createElement("canvas");out.width=maxX-minX+1;out.height=maxY-minY+1;
   out.getContext("2d").drawImage(c,minX,minY,out.width,out.height,0,0,out.width,out.height);
   resolve(out.toDataURL("image/png"));
  };
  im.onerror=()=>resolve(src); im.src=src;
 });
}

async function identifyFragrantica(name){
 try{
  const r=await fetch(FRAGANTICA_API+"?name="+encodeURIComponent(name));
  if(!r.ok)return null;
  return await r.json();
 }catch(e){return null}
}

async function readPdf(file){
 if(!file)return;
 if(file.type!=="application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){
  $("status").textContent="Selecciona un archivo PDF válido."; return;
 }
 state.length=0;
 $("tools").classList.remove("hide");
 $("grid").innerHTML="";
 $("status").textContent="Abriendo PDF…";
 try{
  const buffer=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
  for(let n=1;n<=pdf.numPages;n++){
   $("status").textContent="Procesando página "+n+" de "+pdf.numPages+"…";
   const page=await pdf.getPage(n);
   const view=page.getViewport({scale:2});
   const c=document.createElement("canvas");
   c.width=Math.ceil(view.width); c.height=Math.ceil(view.height);
   const ctx=c.getContext("2d");
   await page.render({canvasContext:ctx,viewport:view}).promise;
   const text=await page.getTextContent();
   const items=text.items||[];
   let images=[];
   try{
    const op=await page.getOperatorList();
    for(let i=0;i<op.fnArray.length;i++){
     const fn=op.fnArray[i],args=op.argsArray[i];
     if(fn===pdfjsLib.OPS.paintImageXObject || fn===pdfjsLib.OPS.paintJpegXObject){
      const key=args[0];
      const obj=await new Promise(resolve=>{
       let tries=0;
       const check=()=>{
        const value=page.objs.get(key);
        if(value) resolve(value);
        else if(++tries<30) setTimeout(check,30);
        else resolve(null);
       };
       check();
      });
      if(obj && obj.width && obj.height){
       const q=document.createElement("canvas");
       q.width=obj.width;q.height=obj.height;
       const qctx=q.getContext("2d");
       qctx.drawImage(obj,0,0);
       images.push(q.toDataURL("image/png"));
      }
     }
    }
   }catch(err){console.warn("No se pudieron extraer imágenes individuales:",err)}
   if(images.length){
    for(let i=0;i<images.length;i++){
     const rawName=i===0?nameFromText(items):"Perfume "+(i+1);
     const src=await trimProductImage(images[i]);
     const product={name:rawName,src,kind:"extraída",fragantica:null,confidence:false};
     state.push(product);
     const match=await identifyFragrantica(rawName);
     if(match&&match.name){product.name=match.name;product.fragantica=match.url||null;product.confidence=true}
    }
   }else{
    const rawName=nameFromText(items);
    const product={name:rawName,src:await trimProductImage(c.toDataURL("image/jpeg",.9)),kind:"página",fragantica:null,confidence:false};
    const match=await identifyFragrantica(rawName);
    if(match&&match.name){product.name=match.name;product.fragantica=match.url||null;product.confidence=true}
    state.push(product);
   }
   render();
  }
  $("status").textContent=state.length+" perfumes detectados. Se intentó identificar cada uno con Fragrantica; revisa los marcados como «revisar».";
 }catch(err){
  console.error(err);
  $("status").textContent="No se pudo leer el PDF: "+(err.message||"error desconocido");
 }
}

function render(){
 $("grid").innerHTML="";
 state.forEach((p,i)=>{
  const d=document.createElement("article");d.className="card";
  d.innerHTML='<span class="tag">'+p.kind+(p.confidence?' · Fragrantica ✓':' · revisar')+'</span><div class="pic"><img src="'+p.src+'" alt=""></div><div class="body"><input value="'+esc(p.name)+'"><div class="actions"><button class="alt find">Buscar imagen</button><button class="alt frag">Fragrantica</button><button class="alt del">Eliminar</button></div></div>';
  d.querySelector("input").oninput=e=>p.name=e.target.value;
  d.querySelector(".find").onclick=()=>window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name+" perfume bottle"),"_blank");
  d.querySelector(".frag").onclick=async()=>{const m=await identifyFragrantica(p.name);if(m&&m.name){p.name=m.name;p.fragantica=m.url||null;p.confidence=true;render()}else window.open("https://www.google.com/search?q="+encodeURIComponent("site:fragrantica.com/perfume "+p.name)," _blank")};
  d.querySelector(".del").onclick=()=>{state.splice(i,1);render()};
  $("grid").appendChild(d);
 });
}
function esc(s){return String(s).replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;")}

$("add").onclick=()=>{
 state.push({name:"Nuevo perfume",src:"data:image/svg+xml;charset=utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#050505"/><text x="50%" y="50%" fill="#d9b84a" text-anchor="middle" font-size="30">ZUASH</text></svg>'),kind:"manual"});
 render();
};
$("search").onclick=()=>state.forEach((p,i)=>{
 if(p.kind!=="extraída") setTimeout(()=>window.open("https://www.google.com/search?tbm=isch&q="+encodeURIComponent(p.name+" perfume bottle"),"_blank"),i*250);
});
$("pdf").onclick=()=>{
 if(!state.length){$("status").textContent="Primero carga un PDF.";return}
 const doc=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=10,G=5,C=2,R=4,top=22,cw=(W-2*M-G)/C,ch=(H-top-M-G*3)/R;
 state.forEach((p,i)=>{
  if(i&&i%8===0)doc.addPage();
  if(i%8===0){
   doc.setFillColor(7,7,7);doc.rect(0,0,W,H,"F");
   doc.setTextColor(225,194,82);doc.setFont("helvetica","bold");doc.setFontSize(19);doc.text("ZUASH",W/2,13,{align:"center"});
   doc.setDrawColor(120,95,25);doc.line(M,17,W-M,17);
  }
  const k=i%8,x=M+(k%2)*(cw+G),y=top+Math.floor(k/2)*(ch+G);
  doc.setFillColor(15,15,15);doc.roundedRect(x,y,cw,ch,3,3,"F");
  doc.setDrawColor(48,48,48);doc.roundedRect(x,y,cw,ch,3,3,"S");
  try{doc.addImage(p.src,p.src.startsWith("data:image/png")?"PNG":"JPEG",x+4,y+5,cw-8,ch-23,undefined,"FAST")}catch(e){console.warn(e)}
  doc.setTextColor(225,194,82);doc.setFontSize(10);doc.text(p.name||"Perfume",x+cw/2,y+ch-8,{align:"center",maxWidth:cw-8});
 });
 doc.save("Catalogo-ZUASH.pdf");
 $("status").textContent="Catálogo generado correctamente.";
};
window.addEventListener("error",e=>{
 if(e.message) $("status").textContent="Error de la aplicación: "+e.message;
});
</script></body></html>
