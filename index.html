<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUASH Catalog Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:Arial,sans-serif}
header{padding:22px 6%;border-bottom:1px solid #302712;display:flex;justify-content:space-between;align-items:center}
.logo{letter-spacing:9px;font-size:30px;font-weight:800;color:#d9b84a}header small{color:#888}
main{max-width:1280px;margin:30px auto;padding:0 20px}h1{text-align:center;font-size:38px;margin:0}
.sub{text-align:center;color:#999;margin:8px 0 25px}.drop{display:block;text-align:center;padding:42px;border:1px dashed #766020;border-radius:18px;background:#101010;cursor:pointer}
.drop:hover{border-color:#e2c65b}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.tools .grow{flex:1}button{border:1px solid #c9a227;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer;background:linear-gradient(#e0c35a,#a17e18);color:#090909}
button.alt{background:#161616;color:#eee;border-color:#444}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#101010;border:1px solid #292929;border-radius:14px;overflow:hidden;position:relative}.pic{height:255px;display:flex;align-items:center;justify-content:center;padding:12px;background:#050505}
.pic img{max-width:100%;max-height:100%;object-fit:contain}.body{padding:12px}.body input{width:100%;padding:10px;background:#181818;border:1px solid #3a3a3a;border-radius:7px;color:#fff;font-weight:700}
.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;font-size:11px}.tag{position:absolute;top:8px;left:8px;background:#000d;border:1px solid #6d591d;color:#e3c75d;border-radius:20px;padding:4px 7px;font-size:10px;z-index:2}
.status{color:#999;font-size:13px;margin:12px 0}.hide{display:none}.meta{color:#777;font-size:11px;line-height:1.45;margin-top:5px}.review{border-color:#8b5b20}
.progress{height:5px;background:#191919;border-radius:5px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;width:0;background:#d9b84a;transition:width .2s}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#151515;border:1px solid #2b2b2b;color:#aaa;font-size:11px;margin:3px 3px 0 0}
</style>
</head>
<body>
<header><div class="logo">ZUASH</div><small>PREMIUM FRAGRANCE CATALOG STUDIO · HYBRID AI</small></header>
<main>
<h1>Generador de catálogo</h1>
<div class="sub">PDF → comprensión visual → detección individual → identificación → imagen limpia → catálogo</div>
<label class="drop"><b>Arrastra cualquier PDF aquí o haz clic para seleccionarlo</b><br><small>El sistema analiza cada página de forma independiente y nunca convierte una página completa en un producto.</small><input id="file" type="file" accept="application/pdf" hidden></label>
<div id="tools" class="tools hide"><button id="add">＋ Añadir</button><button id="search" class="alt">🔎 Reintentar imágenes</button><span class="grow"></span><button id="pdf">Generar catálogo PDF</button></div>
<div id="status" class="status"></div><div id="providers"></div><div class="progress"><i id="bar"></i></div><div id="grid" class="grid"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const {jsPDF}=window.jspdf,$=id=>document.getElementById(id);
const state=[];let busy=false;
const API="/api";

$("file").addEventListener("change",e=>{const f=e.target.files?.[0];if(f)readPdf(f)});
const drop=document.querySelector(".drop");
drop.addEventListener("dragover",e=>{e.preventDefault();drop.style.borderColor="#e2c65b"});
drop.addEventListener("dragleave",()=>drop.style.borderColor="");
drop.addEventListener("drop",e=>{e.preventDefault();drop.style.borderColor="";const f=e.dataTransfer.files?.[0];if(f)readPdf(f)});

const clean=s=>String(s??"").replace(/\s+/g," ").trim();
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function normalizeName(s){
 let t=clean(s);
 t=t.replace(/^\s*[#№]?\s*\d{1,4}[\s.):-]+/,"");
 t=t.replace(/\s+(@\w+|instagram\s*:\s*\S+|ig\s*:\s*\S+)$/i,"");
 t=t.replace(/\s+(\d+(?:\.\d+)?\s*(?:ml|oz))\s*$/i,"");
 return t.trim();
}
function likelyName(s){
 const t=normalizeName(s);
 if(!t||t.length>100)return false;
 return /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]{3}/.test(t)&&!/^(perfume|fragancia|fragrance)$/i.test(t);
}

function groupTextLines(blocks){
 const lines=[];
 for(const b of [...blocks].sort((a,b)=>a.y-b.y||a.x-b.x)){
   let line=lines.find(l=>Math.abs(l.y-b.y)<Math.max(7,b.h*.75));
   if(!line){line={y:b.y,h:b.h,items:[]};lines.push(line)}
   line.items.push(b);line.h=Math.max(line.h,b.h);line.y=Math.min(line.y,b.y);
 }
 return lines.map(l=>{
   l.items.sort((a,b)=>a.x-b.x);
   return {x:l.items[0].x,y:l.y,w:l.items.at(-1).x+l.items.at(-1).w-l.items[0].x,h:l.h,text:clean(l.items.map(x=>x.text).join(" "))};
 }).sort((a,b)=>a.y-b.y||a.x-b.x);
}

function pdfTextBlocks(items,viewport){
 return (items||[]).map(it=>{
   const tr=it.transform||[1,0,0,1,0,0];
   const p=viewport.convertToViewportPoint(tr[4],tr[5]);
   const p2=viewport.convertToViewportPoint(tr[4]+(it.width||0),tr[5]);
   const fs=Math.max(7,Math.hypot(tr[0],tr[1])||Math.abs(tr[3])||10);
   return {text:clean(it.str),x:Math.min(p[0],p2[0]),y:p[1]-fs,w:Math.max(3,Math.abs(p2[0]-p[0])),h:fs};
 }).filter(x=>x.text.length>1);
}

function imageToBase64(canvas){
 return new Promise(resolve=>canvas.toBlob(b=>{
   const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]||"");r.readAsDataURL(b);
 },"image/jpeg",.84));
}

function boxCrop(canvas,box){
 const x=clamp(Math.floor(box.x-box.w*.025),0,canvas.width-1);
 const y=clamp(Math.floor(box.y-box.h*.025),0,canvas.height-1);
 const r=clamp(Math.ceil(box.x+box.w+box.w*.025),x+1,canvas.width);
 const b=clamp(Math.ceil(box.y+box.h+box.h*.025),y+1,canvas.height);
 const out=document.createElement("canvas");out.width=r-x;out.height=b-y;
 out.getContext("2d").drawImage(canvas,x,y,out.width,out.height,0,0,out.width,out.height);
 return out.toDataURL("image/png");
}

async function analyzePage(canvas,textBlocks,pageNumber){
 const image=await imageToBase64(canvas);
 const hints=groupTextLines(textBlocks).map(x=>x.text).filter(likelyName).slice(0,80);
 const r=await fetch(API+"/ai-page",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image,width:canvas.width,height:canvas.height,textHints:hints,pageNumber})});
 if(!r.ok)throw new Error(await r.text());
 return await r.json();
}

async function identify(name){
 try{const r=await fetch(API+"/fragrantica?name="+encodeURIComponent(name));if(!r.ok)return null;return await r.json()}catch(_){return null}
}
async function imageSearch(name){
 try{const r=await fetch(API+"/images?name="+encodeURIComponent(name));if(!r.ok)return null;return await r.json()}catch(_){return null}
}
async function enrich(p){
 const q=normalizeName(p.name);
 if(!likelyName(q))return false;
 const frag=await identify(q);
 if(frag?.name){
   p.name=normalizeName(frag.name);
   p.fragrantica=frag.url||null;
   if(frag.image&&!p.cleanImage)p.cleanImage=frag.image;
 }
 const img=await imageSearch(p.name);
 if(img?.image){
   p.src=img.image;p.imageSource=img.source||"Google Images";p.imageUrl=img.url||null;p.cleanImage=true;
 }else if(frag?.image){
   p.src=frag.image;p.imageSource="Fragrantica";p.imageUrl=frag.url||null;p.cleanImage=true;
 }
 return true;
}
function iou(a,b){
 const x=Math.max(a.x,b.x),y=Math.max(a.y,b.y),r=Math.min(a.x+a.w,b.x+b.w),bt=Math.min(a.y+a.h,b.y+b.h);
 const inter=Math.max(0,r-x)*Math.max(0,bt-y),u=a.w*a.h+b.w*b.h-inter;return u?inter/u:0;
}
function rejectBadBox(box,W,H){
 const area=box.w*box.h,ratio=area/(W*H);
 return !box||!isFinite(area)||box.w<W*.03||box.h<H*.03||ratio>.72;
}
function render(){
 $("grid").innerHTML="";
 state.forEach((p,i)=>{
   const d=document.createElement("article");d.className="card"+(p.review?" review":"");
   d.innerHTML='<span class="tag">'+esc(p.method||"IA")+(p.identity?' · '+esc(p.identity):"")+'</span><div class="pic"><img src="'+esc(p.src)+'" alt=""></div><div class="body"><input value="'+esc(p.name)+'"><div class="meta">Página '+p.page+(typeof p.confidence==="number"?" · Confianza "+Math.round(p.confidence*100)+"%":"")+(p.imageSource?" · Imagen: "+esc(p.imageSource):"")+(p.evidence?"<br>"+esc(p.evidence):"")+'</div><div class="actions"><button class="alt find">Imagen limpia</button><button class="alt frag">Fragrantica</button><button class="alt del">Eliminar</button></div></div>';
   d.querySelector("input").oninput=e=>p.name=e.target.value;
   d.querySelector(".find").onclick=async()=>{await enrich(p);render()};
   d.querySelector(".frag").onclick=async()=>{const m=await identify(p.name);if(m?.url)window.open(m.url,"_blank");else window.open("https://www.google.com/search?q="+encodeURIComponent("site:fragrantica.com/perfume "+p.name),"_blank")};
   d.querySelector(".del").onclick=()=>{state.splice(i,1);render()};
   $("grid").appendChild(d);
 });
}
function setProgress(v){$("bar").style.width=clamp(v,0,100)+"%"}

$("add").onclick=()=>{state.push({name:"Nuevo perfume",src:"data:image/svg+xml;charset=utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#050505"/><text x="50%" y="50%" fill="#d9b84a" text-anchor="middle" font-size="30">ZUASH</text></svg>'),kind:"manual",method:"Manual",page:"—",review:true});render()};
$("search").onclick=async()=>{
 for(let i=0;i<state.length;i++){await enrich(state[i]);setProgress((i+1)/Math.max(1,state.length)*100)}
 render();
};
$("pdf").onclick=()=>{
 if(!state.length){$("status").textContent="Primero carga un PDF.";return}
 const doc=new jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=10,G=5,top=22,cw=(W-2*M-G)/2,ch=(H-top-M-G*3)/4;
 state.forEach((p,i)=>{
   if(i&&i%8===0)doc.addPage();
   if(i%8===0){doc.setFillColor(7,7,7);doc.rect(0,0,W,H,"F");doc.setTextColor(225,194,82);doc.setFont("helvetica","bold");doc.setFontSize(19);doc.text("ZUASH",W/2,13,{align:"center"});doc.setDrawColor(120,95,25);doc.line(M,17,W-M,17)}
   const k=i%8,x=M+(k%2)*(cw+G),y=top+Math.floor(k/2)*(ch+G);
   doc.setFillColor(15,15,15);doc.roundedRect(x,y,cw,ch,3,3,"F");doc.setDrawColor(48,48,48);doc.roundedRect(x,y,cw,ch,3,3,"S");
   try{doc.addImage(p.src,p.src.startsWith("data:image/png")?"PNG":"JPEG",x+4,y+5,cw-8,ch-23,undefined,"FAST")}catch(_){}
   doc.setTextColor(225,194,82);doc.setFontSize(10);doc.text(p.name||"Perfume",x+cw/2,y+ch-8,{align:"center",maxWidth:cw-8});
 });
 doc.save("Catalogo-ZUASH.pdf");$("status").textContent="Catálogo generado correctamente.";
};

async function readPdf(file){
 if(busy)return;
 if(!file||(!file.type.includes("pdf")&&!file.name.toLowerCase().endsWith(".pdf"))){$("status").textContent="Selecciona un PDF válido.";return}
 busy=true;state.length=0;$("tools").classList.remove("hide");$("grid").innerHTML="";$("providers").innerHTML="";setProgress(0);
 try{
   const buf=await file.arrayBuffer();
   const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
   let used={gemini:false,productSearch:false};
   for(let n=1;n<=pdf.numPages;n++){
     $("status").textContent="Comprendiendo página "+n+" de "+pdf.numPages+"…";
     const page=await pdf.getPage(n),viewport=page.getViewport({scale:2.2});
     const canvas=document.createElement("canvas");canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);
     await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
     const blocks=pdfTextBlocks((await page.getTextContent()).items||[],viewport);
     const result=await analyzePage(canvas,blocks,n);\n     if(!result.providers?.gemini&&!result.providers?.productSearch){throw new Error("No hay motor de visión configurado. Añade GEMINI_API_KEY en las variables de entorno de Vercel.");}
     used.gemini=used.gemini||Boolean(result.providers?.gemini);
     used.productSearch=used.productSearch||Boolean(result.providers?.productSearch);
     const products=result.products||[];
     const accepted=[];
     for(const p of products){
       if(!p.box||rejectBadBox(p.box,canvas.width,canvas.height))continue;
       if(accepted.some(x=>iou(x.box,p.box)>.55))continue;
       accepted.push(p);
       const src=boxCrop(canvas,p.box);
       const item={
         name:normalizeName(p.name)||"Perfume",
         src,
         page:n,
         confidence:Number(p.confidence)||0,
         method:p.method||"IA",
         identity:p.identity||null,
         evidence:p.evidence||"",
         review:Number(p.confidence||0)<.6||!likelyName(p.name)
       };
       if(likelyName(item.name))await enrich(item);
       state.push(item);render();
     }
     if(!products.length)$("status").textContent="Página "+n+": ningún producto individual confirmado.";
     setProgress(n/pdf.numPages*100);
   }
   $("providers").innerHTML='<span class="pill">Gemini '+(used.gemini?"✓":"no configurado")+'</span><span class="pill">Product Search '+(used.productSearch?"✓":"opcional")+'</span><span class="pill">Fragrantica ✓</span><span class="pill">Google Images '+(typeof fetch==="function"?"vía API":"—")+'</span>';
   $("status").textContent=state.length+" productos individuales confirmados. Las páginas completas nunca se usan como producto.";
 }catch(e){
   console.error(e);
   $("status").textContent="No se pudo procesar el PDF: "+(e?.message||"error desconocido");
 }finally{busy=false}
}
window.addEventListener("error",e=>{if(e.message)$("status").textContent="Error: "+e.message});
</script>
</body>
</html>
